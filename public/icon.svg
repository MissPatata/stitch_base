<svg
  width="256"
  height="256"
  viewBox="0 0 256 256"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Background -->
  <rect
    x="16"
    y="16"
    width="224"
    height="224"
    rx="56"
    ry="56"
    fill="#FAD4DF"
  />

  <!-- Spool body -->
  <rect
    x="88"
    y="72"
    width="80"
    height="112"
    rx="18"
    ry="18"
    fill="#FFFFFF"
  />

  <!-- Spool top -->
  <rect
    x="80"
    y="60"
    width="96"
    height="20"
    rx="10"
    ry="10"
    fill="#F5AEBF"
  />

  <!-- Spool bottom -->
  <rect
    x="80"
    y="184"
    width="96"
    height="20"
    rx="10"
    ry="10"
    fill="#F5AEBF"
  />

  <!-- Horizontal thread lines -->
  <line x1="96" y1="96" x2="160" y2="96" stroke="#F2A1B5" stroke-width="4" />
  <line x1="96" y1="112" x2="160" y2="112" stroke="#F2A1B5" stroke-width="4" />
  <line x1="96" y1="128" x2="160" y2="128" stroke="#F2A1B5" stroke-width="4" />
  <line x1="96" y1="144" x2="160" y2="144" stroke="#F2A1B5" stroke-width="4" />
  <line x1="96" y1="160" x2="160" y2="160" stroke="#F2A1B5" stroke-width="4" />

  <!-- Needle -->
  <path
    d="M176 72 L210 40"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="round"
  />
  <circle cx="210" cy="40" r="4" fill="#FFFFFF" />

  <!-- Thread curve -->
  <path
    d="M164 92
       C 190 110, 198 132, 184 148
       C 168 166, 140 170, 118 162
       C 96 154, 80 140, 74 126"
    fill="none"
    stroke="#E97998"
    stroke-width="4"
    stroke-linecap="round"
  />
</svg>
